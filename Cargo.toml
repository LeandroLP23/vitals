[package]
name = "vitals"
version = "0.2.0"
edition = "2021"
description = "Tiny always-on-top CPU / RAM / GPU / VRAM overlay for Windows, styled after the NVIDIA App statistics overlay"
license = "MIT"
repository = "https://github.com/LeandroLP23/vitals"

[build-dependencies]
embed-resource = "3"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
